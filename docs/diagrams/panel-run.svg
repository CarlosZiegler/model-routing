<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="panel-run-title panel-run-desc" id="panel-run-root">
        <title id="panel-run-title">One real review panel</title>
        <desc id="panel-run-desc">Wall time and cost of each call in one review panel run: GPT-6.1 Terra reviewers 64.8 s for $0.098 and 84.2 s for $0.104, Gemini 4 Argon 863.2 s with no cost reported, GPT-6.1 Terra judge 97.9 s for $0.118, GPT-6.1 Sol escalation 106.6 s for $0.227; 15 findings became 12 confirmed, 1 plausible and 2 rejected, and the escalation proved one with a test.</desc>

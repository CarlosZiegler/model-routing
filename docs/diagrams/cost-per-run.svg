<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cost-per-run-title cost-per-run-desc" id="cost-per-run-root">
        <title id="cost-per-run-title">Average cost per run, by lane</title>
        <desc id="cost-per-run-desc">Average reported Claude cost per run in a production project on 2026-11-06 and 07: Opus medium $6.17 over 24 runs, Opus xhigh $5.02 over 2, Opus high $3.69 over 5, Sonnet high $1.32 over 26, Haiku max $0.39 and Sonnet medium $0.35 over one run each; Opus medium took about 70% of the $211.65 total.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #cost-per-run-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36; --font-sans: 'Geist', 'Helvetica Neue', Arial, sans-serif; --font-serif: 'Instrument Serif', Georgia, serif; --font-mono: 'Geist Mono', ui-monospace, Menlo, Consolas, monospace; }
      #cost-per-run-root { font-family: var(--font-sans); color: var(--color-ink); }
      #cost-per-run-root .diagram-container { width: 100%; overflow-x: auto; }
      #cost-per-run-root .diagram-container { overflow-x: visible; }</style></defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Gridlines (before bars) -->
        <line x1="392" y1="48" x2="392" y2="316" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <line x1="552" y1="48" x2="552" y2="316" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <line x1="712" y1="48" x2="712" y2="316" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <line x1="872" y1="48" x2="872" y2="316" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>

        <!-- Bars: x = 232 + value * 80 -->
        <!-- Opus medium (FOCAL) -->
        <rect x="232" y="60" width="494" height="24" fill="#f5f5f5"/>
        <rect x="232" y="60" width="494" height="24" fill="#eb6c36" fill-opacity="0.12" stroke="#eb6c36" stroke-width="1"/>
        <text x="734" y="76" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace">$6.17</text>
        <!-- Opus xhigh -->
        <rect x="232" y="104" width="402" height="24" fill="#f5f5f5"/>
        <rect x="232" y="104" width="402" height="24" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
        <text x="642" y="120" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace">$5.02</text>
        <!-- Opus high -->
        <rect x="232" y="148" width="295" height="24" fill="#f5f5f5"/>
        <rect x="232" y="148" width="295" height="24" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
        <text x="535" y="164" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace">$3.69</text>
        <!-- Sonnet high -->
        <rect x="232" y="192" width="106" height="24" fill="#f5f5f5"/>
        <rect x="232" y="192" width="106" height="24" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
        <text x="346" y="208" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace">$1.32</text>
        <!-- Haiku max -->
        <rect x="232" y="236" width="31" height="24" fill="#f5f5f5"/>
        <rect x="232" y="236" width="31" height="24" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
        <text x="271" y="252" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace">$0.39</text>
        <!-- Sonnet medium -->
        <rect x="232" y="280" width="28" height="24" fill="#f5f5f5"/>
        <rect x="232" y="280" width="28" height="24" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
        <text x="268" y="296" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace">$0.35</text>

        <!-- Axes (after bars so the zero line stays crisp) -->
        <line x1="232" y1="48" x2="232" y2="316" stroke="#2d3142" stroke-opacity="0.25" stroke-width="1"/>
        <line x1="232" y1="316" x2="872" y2="316" stroke="#2d3142" stroke-opacity="0.25" stroke-width="1"/>

        <!-- Category labels -->
        <text x="216" y="71" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="end">Opus 5.5 · medium</text>
        <text x="216" y="83" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="end">24 runs</text>
        <text x="216" y="115" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="end">Opus 5.5 · xhigh</text>
        <text x="216" y="127" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="end">2 runs</text>
        <text x="216" y="159" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="end">Opus 5.5 · high</text>
        <text x="216" y="171" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="end">5 runs</text>
        <text x="216" y="203" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="end">Sonnet 5.5 · high</text>
        <text x="216" y="215" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="end">26 runs</text>
        <text x="216" y="247" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="end">Haiku 5.5 · max</text>
        <text x="216" y="259" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="end">1 run</text>
        <text x="216" y="291" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="end">Sonnet 5.5 · medium</text>
        <text x="216" y="303" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="end">1 run</text>

        <!-- Tick labels + axis title -->
        <text x="232" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">$0</text>
        <text x="392" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">$2</text>
        <text x="552" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">$4</text>
        <text x="712" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">$6</text>
        <text x="872" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">$8</text>
        <text x="552" y="348" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">AVERAGE CLAUDE COST PER RUN (USD, AS REPORTED BY CLAUDE CODE)</text>

        <!-- Editorial callout -->
        <text x="232" y="380" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, serif">Opus medium ran 24 times and took about 70% of the $211.65 Claude total.</text>

        <!-- Legend strip -->
        <line x1="48" y1="404" x2="912" y2="404" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="48" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="432" width="16" height="10" rx="2" fill="#eb6c36" fill-opacity="0.12" stroke="#eb6c36" stroke-width="1"/>
        <text x="144" y="441" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">largest share of spend</text>
        <rect x="280" y="432" width="16" height="10" rx="2" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
        <text x="304" y="441" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">other Claude lanes</text>
        <text x="912" y="441" fill="#7a8399" font-size="7.5" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="end">pool ledger · a production project · 2026-11-06/07 · sorted by cost</text>
      </svg>

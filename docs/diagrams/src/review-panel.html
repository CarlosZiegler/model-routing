<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The review panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36; --font-sans: 'Geist', 'Helvetica Neue', Arial, sans-serif; --font-serif: 'Instrument Serif', Georgia, serif; --font-mono: 'Geist Mono', ui-monospace, Menlo, Consolas, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · fan-in · model-routing</p>
    <h1>The review panel</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="review-panel-title review-panel-desc">
        <title id="review-panel-title">The review panel</title>
        <desc id="review-panel-desc">A diff written by Claude goes to two GPT-6.1 Terra reviewers and one Gemini 4 Argon reviewer in parallel and read-only; a GPT-6.1 Terra judge debates, dedupes and verifies their findings into confirmed, plausible or rejected verdicts, and only disputed or needs-test findings go to a GPT-6.1 Sol escalation that proves them with tests.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: the reviewers (drawn first) -->
        <rect x="256" y="48" width="232" height="272" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="272" y="52" width="200" height="12" rx="2" fill="#f5f5f5"/>
        <text x="372" y="61" fill="#2d3142" fill-opacity="0.55" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">OTHER VENDORS · PARALLEL · READ-ONLY</text>

        <!-- Connectors -->
        <path d="M 208,176 H 232 Q 240,176 240,168 V 120 Q 240,112 248,112 H 271" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="208" y1="192" x2="271" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 208,208 H 232 Q 240,208 240,216 V 264 Q 240,272 248,272 H 271" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 472,112 H 504 Q 512,112 512,120 V 168 Q 512,176 520,176 H 551" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="472" y1="192" x2="551" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 472,272 H 504 Q 512,272 512,264 V 216 Q 512,208 520,208 H 551" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="712" y1="192" x2="775" y2="192" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <line x1="632" y1="224" x2="632" y2="287" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M 712,320 H 836 Q 844,320 844,312 V 241" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="640" y="250" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="674" y="259" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">IF DISPUTED</text>
        <rect x="732" y="302" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="774" y="311" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">PROVEN BY TEST</text>

        <!-- The diff (input) -->
        <rect x="48" y="160" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="160" width="160" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
        <rect x="56" y="166" width="68" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.6" stroke-width="0.8"/>
        <text x="90" y="175" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CODE CHANGE</text>
        <text x="128" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">The diff</text>
        <text x="128" y="211" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">written by Claude</text>

        <!-- Reviewer 1 -->
        <rect x="272" y="80" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="272" y="80" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="280" y="86" width="64" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="312" y="95" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REVIEWER 1</text>
        <text x="372" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">GPT-6.1 Terra</text>
        <text x="372" y="131" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">Codex · high effort</text>

        <!-- Reviewer 2 -->
        <rect x="272" y="160" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="272" y="160" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="280" y="166" width="64" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="312" y="175" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REVIEWER 2</text>
        <text x="372" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">GPT-6.1 Terra</text>
        <text x="372" y="211" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">Codex · high effort</text>

        <!-- Reviewer 3 -->
        <rect x="272" y="240" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="272" y="240" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="280" y="246" width="64" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="312" y="255" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REVIEWER 3</text>
        <text x="372" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Gemini 4 Argon</text>
        <text x="372" y="291" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">Antigravity · high effort</text>

        <!-- Judge (FOCAL) -->
        <rect x="552" y="160" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="552" y="160" width="160" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="560" y="166" width="40" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.6" stroke-width="0.8"/>
        <text x="580" y="175" fill="#eb6c36" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">JUDGE</text>
        <text x="632" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">GPT-6.1 Terra</text>
        <text x="632" y="211" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">debate · dedupe · verify</text>

        <!-- Final report (store) -->
        <rect x="776" y="144" width="136" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="776" y="144" width="136" height="96" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <rect x="784" y="150" width="52" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="810" y="159" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">FINAL.MD</text>
        <text x="844" y="182" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Verdicts</text>
        <text x="844" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">CONFIRMED · act</text>
        <text x="844" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">PLAUSIBLE · prove</text>
        <text x="844" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">REJECTED · drop</text>

        <!-- Sol escalation (optional) -->
        <rect x="552" y="288" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="552" y="288" width="160" height="64" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="560" y="294" width="64" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
        <text x="592" y="303" fill="#2d3142" fill-opacity="0.7" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">ESCALATION</text>
        <text x="632" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">GPT-6.1 Sol</text>
        <text x="632" y="339" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">runs tests to prove</text>

        <!-- Editorial callout (bottom-left margin) -->
        <text x="48" y="300" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, serif">Never the builder's vendor:</text>
        <text x="48" y="318" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, serif">Claude wrote this diff, so</text>
        <text x="48" y="336" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, serif">OpenAI and Google review it.</text>

        <!-- Legend strip -->
        <line x1="48" y1="376" x2="912" y2="376" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="48" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="404" width="16" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
        <text x="144" y="413" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">the diff</text>
        <rect x="208" y="404" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="232" y="413" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">reviewer</text>
        <rect x="296" y="404" width="16" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="320" y="413" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">judge</text>
        <rect x="376" y="404" width="16" height="10" rx="2" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="400" y="413" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">escalation</text>
        <rect x="480" y="404" width="16" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="504" y="413" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">report</text>
        <line x1="568" y1="409" x2="587" y2="409" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="596" y="413" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">findings</text>
        <line x1="664" y1="409" x2="683" y2="409" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="692" y="413" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">verdicts</text>
        <line x1="760" y1="409" x2="779" y2="409" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="788" y="413" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">only if needed</text>
      </svg>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who works for whom</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36; --font-sans: 'Geist', 'Helvetica Neue', Arial, sans-serif; --font-serif: 'Instrument Serif', Georgia, serif; --font-mono: 'Geist Mono', ui-monospace, Menlo, Consolas, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · model-routing</p>
    <h1>Who works for whom</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="accounts-title accounts-desc">
        <title id="accounts-title">Who works for whom</title>
        <desc id="accounts-desc">You give goals to the coordinator on the main Claude account, which sends each brief to the TypeSafe Jev classifier, writes every run to a local pool ledger, and hands work to four headless worker accounts: Claude team seats, Codex Pro, Google AI Pro through Antigravity, and an X subscription through Grok.</desc>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: worker accounts -->
        <rect x="552" y="40" width="360" height="384" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="658" y="44" width="148" height="12" rx="2" fill="#f5f5f5"/>
        <text x="732" y="53" fill="#2d3142" fill-opacity="0.55" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">WORKER ACCOUNTS · HEADLESS</text>

        <!-- Connectors -->
        <line x1="168" y1="240" x2="231" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="332" y1="192" x2="332" y2="137" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="332" y1="288" x2="332" y2="343" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 432,204 H 472 Q 480,204 480,196 V 116 Q 480,108 488,108 H 571" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 432,228 H 496 Q 504,228 504,220 V 204 Q 504,196 512,196 H 571" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 432,252 H 496 Q 504,252 504,260 V 276 Q 504,284 512,284 H 571" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 432,276 H 472 Q 480,276 480,284 V 364 Q 480,372 488,372 H 571" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <text x="200" y="231" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">GOALS</text>
        <rect x="340" y="158" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="372" y="167" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">BRIEF ONLY</text>
        <rect x="340" y="310" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="370" y="319" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">EVERY RUN</text>

        <!-- You (input) -->
        <rect x="48" y="208" width="120" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="208" width="120" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
        <rect x="56" y="214" width="40" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.6" stroke-width="0.8"/>
        <text x="76" y="223" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">OWNER</text>
        <text x="108" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">You</text>
        <text x="108" y="259" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">goals · approvals</text>

        <!-- Jev (external API) -->
        <rect x="232" y="72" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="232" y="72" width="200" height="64" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <rect x="240" y="78" width="72" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
        <text x="276" y="87" fill="#2d3142" fill-opacity="0.7" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">TYPESAFE API</text>
        <text x="332" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Jev classifier</text>
        <text x="332" y="123" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">HTTPS · 0.2–0.6 s per brief</text>

        <!-- Coordinator (FOCAL) -->
        <rect x="232" y="192" width="200" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="232" y="192" width="200" height="96" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="240" y="200" width="72" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.6" stroke-width="0.8"/>
        <text x="276" y="209" fill="#eb6c36" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">MAIN ACCOUNT</text>
        <text x="332" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Coordinator</text>
        <text x="332" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">Claude Code · Opus xhigh</text>
        <text x="332" y="258" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">no 5-hour cap</text>
        <text x="332" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">plans · routes · verifies</text>

        <!-- Pool ledger (store) -->
        <rect x="232" y="344" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="232" y="344" width="200" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <rect x="240" y="350" width="64" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="272" y="359" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">LOCAL FILE</text>
        <text x="332" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Pool ledger</text>
        <text x="332" y="395" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">pool-ledger.tsv per project</text>

        <!-- Worker 1: Claude team seats -->
        <rect x="572" y="72" width="320" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="572" y="72" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="580" y="80" width="68" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="614" y="89" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CLAUDE CODE</text>
        <text x="732" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Team seats ×N</text>
        <text x="732" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">claude -p · one CLAUDE_CONFIG_DIR each</text>
        <text x="732" y="135" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">builds · Haiku, Sonnet, Opus</text>

        <!-- Worker 2: Codex Pro -->
        <rect x="572" y="160" width="320" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="572" y="160" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="580" y="168" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="602" y="177" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">OPENAI</text>
        <text x="732" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Codex Pro</text>
        <text x="732" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">codex exec · GPT-6.1 Sol / Terra, GPT-6 Astra</text>
        <text x="732" y="223" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">review panel · overflow builds</text>

        <!-- Worker 3: Google AI Pro -->
        <rect x="572" y="248" width="320" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="572" y="248" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="580" y="256" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="602" y="265" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">GOOGLE</text>
        <text x="732" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Google AI Pro</text>
        <text x="732" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">agy -p · Gemini 4 Argon, 3.8 Flash</text>
        <text x="732" y="311" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">third reviewer · 1,500 requests / day</text>

        <!-- Worker 4: X subscription -->
        <rect x="572" y="336" width="320" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="572" y="336" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="580" y="344" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="594" y="353" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">XAI</text>
        <text x="732" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">X subscription</text>
        <text x="732" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">grok · grok-4.7</text>
        <text x="732" y="399" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">last-line overflow builds</text>

        <!-- Legend strip -->
        <line x1="48" y1="448" x2="912" y2="448" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="48" y="468" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="476" width="16" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
        <text x="144" y="485" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">you</text>
        <rect x="192" y="476" width="16" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="216" y="485" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">coordinator</text>
        <rect x="296" y="476" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="485" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">worker account</text>
        <rect x="424" y="476" width="16" height="10" rx="2" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>

        <line x1="624" y1="481" x2="643" y2="481" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    </div>
  </div>
</body>
</html>
